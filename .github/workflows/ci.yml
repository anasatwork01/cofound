name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref. A superseded PR run is cancelled; main is never
# cancelled, so every commit that lands keeps a real result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs rather than tags. A tag can be
# repointed at new code; a SHA cannot. The trailing comment records the version
# each SHA was, so a reviewer can tell what is being bumped.

jobs:
  meta:
    name: structure and branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Layout matches SPEC section 4
        run: make structure

      # head_ref is attacker-controllable on a fork, so it goes through the
      # environment and never into the shell command itself.
      - name: Branch name follows CONTRIBUTING.md
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: ./scripts/check-branch.sh "$HEAD_REF"

  # `make doctor` is deliberately not run here. It answers "does this machine
  # have the pinned toolchain", which is a developer question. CI answers it
  # structurally instead: every setup-* action below takes its version from
  # .tool-versions via scripts/tool-versions.sh, so a pin that cannot be
  # installed fails that job. Setting up four toolchains in this job just to
  # re-ask the question also fails for reasons about action plumbing rather
  # than about the repository — setup-uv sets UV_PYTHON without provisioning
  # the interpreter or putting it on PATH, so doctor measured the runner's
  # system python3.

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tv
        run: ./scripts/tool-versions.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.tv.outputs.golang }}
          cache-dependency-path: "**/go.sum"
      - run: make lint-go
      - run: make test-go
      - run: make build

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      # The only job that needs the `agent/opencode` submodule.
      # tests/contracts/test_opencode_upstream_contract.py pins upstream source
      # that SPEC section 17's sandbox boundary and section 19's token
      # accounting rest on; without the submodule those pins assert nothing, so
      # the test fails rather than skips when it is absent. fetch-depth 1 is
      # stated rather than left to the default because it is what makes the
      # submodule clone shallow too - only the pinned commit's tree is ever
      # read, never its history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
      - id: tv
        run: ./scripts/tool-versions.sh >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ steps.tv.outputs.python }}
          enable-cache: true
          cache-suffix: python
      - run: uv sync --all-packages --locked
      - run: make lint-py
      - run: make typecheck-py
      - run: make test-py

  js:
    name: js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tv
        run: ./scripts/tool-versions.sh >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.tv.outputs.pnpm }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.tv.outputs.nodejs }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make lint-js
      - run: make typecheck-js
      - run: make test-js
      # The console shell is only a shell if it builds. Task 0.12 deploys it;
      # this is what stops 0.12 discovering a broken build.
      - run: pnpm --filter @halyard/console build

  image:
    name: service image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      # Builds `api` only, not all four. api is the only Go service with
      # third-party dependencies today, so it exercises the module-graph copy
      # and `go work sync` steps that the others would not. The Dockerfile is
      # parameterised by SERVICE, so the rest differ by one build-arg.
      #
      # This job exists because an unbuilt Dockerfile rots: the first real
      # build of this one caught a wrong port variable and a missing-go.sum
      # failure, neither of which review had spotted.
      - name: Build the api image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: infra/docker/Dockerfile
          build-args: |
            SERVICE=api
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          tags: halyard-api-ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A built image that will not start is not a deployable image. The
      # service must exit non-zero with its own config-validation message, not
      # crash — which is what proves the binary and the config binder both work
      # inside the runtime stage.
      - name: The image starts and validates its configuration
        run: |
          set +e
          out="$(docker run --rm -e HALYARD_ENV=development halyard-api-ci 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0 || { echo "expected a non-zero exit with no DATABASE_URL"; exit 1; }
          grep -q "DATABASE_URL: is required" <<<"$out" || {
            echo "expected the chassis config validation to name DATABASE_URL"; exit 1; }

  schema:
    name: schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tv
        run: ./scripts/tool-versions.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.tv.outputs.golang }}
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.tv.outputs.pnpm }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.tv.outputs.nodejs }}
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ steps.tv.outputs.python }}
          enable-cache: true
          cache-suffix: schema
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked

      # Regenerates from the schemas and fails if the committed bindings differ.
      # This is the whole point of committing generated output: without it,
      # "generated from the schema" is a claim nobody checks.
      - run: make gen-check

      # A schema can generate Go that does not compile — an unresolved external
      # $ref becomes a missing import rather than a generator error.
      - run: go build ./...
        working-directory: packages/schema/gen/go

  integration:
    name: integration (postgres + redis)
    runs-on: ubuntu-latest

    # Same image pins as compose.yaml. If these drift, a test passes locally and
    # fails in CI for reasons unrelated to the change under review.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: halyard
          POSTGRES_PASSWORD: halyard
          POSTGRES_DB: halyard
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U halyard -d halyard"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8.10-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://halyard:halyard@localhost:55432/halyard
      # The role services connect as. NOT the migration role: row-level
      # security is inert for a superuser, so a test running as the owner would
      # pass while proving nothing. See db/migrations/00013.
      APP_DATABASE_URL: postgres://halyard_app:halyard_app@localhost:55432/halyard
      REDIS_URL: redis://localhost:56379/0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tv
        run: ./scripts/tool-versions.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.tv.outputs.golang }}
          cache-dependency-path: "**/go.sum"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ steps.tv.outputs.python }}
          enable-cache: true
          cache-suffix: integration
      - run: uv sync --all-packages --locked
      # Applies the schema and grants halyard_app a login. The tenancy tests
      # assert against real tables, so there is nothing to test until this runs.
      - run: make db-setup
      # pytest exits 5 when it collects nothing, so a harness that silently
      # stopped running these tests fails the job instead of reporting green.
      - run: make test-integration
      # The Go tests that need a database. db.Open refusing a role which would
      # bypass row-level security, a scoped transaction not leaking its org onto
      # a pooled connection, and the whole sign-in flow — none of which is
      # testable without Postgres, which is why they run here rather than in the
      # `go` job. They skip there; see packages/db/db_test.go for the guard.
      - run: cd packages/db && go test ./... -count=1
      - run: cd services/api && go test ./... -count=1

  ci:
    name: ci
    if: always()
    needs: [meta, go, python, js, schema, image, integration]
    runs-on: ubuntu-latest
    steps:
      # A single required status check for branch protection: adding a job above
      # does not mean remembering to add it in repository settings.
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed"
              exit 1
            fi
          done
          echo "all jobs succeeded"
