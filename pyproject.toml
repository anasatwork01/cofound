[project]
name = "halyard"
version = "0.0.0"
description = "Halyard control plane - Python services workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

# modal declares `cbor2` unpinned, and the newest cbor2 (6.x) is a Rust
# extension that publishes **no** macOS wheel except `macosx_11_0_arm64` and no
# pure-Python fallback. The repo's pinned Python 3.13.1 is a python.org
# universal2 build whose platform tag is `macosx-10.13-universal2`, so on this
# machine uv finds no compatible wheel, falls through to the sdist and dies with
# "can't find Rust compiler" -- making `uv sync --group bench`, the harness's own
# documented setup step, exit non-zero.
#
# Constrained rather than added as a dependency: halyard does not import cbor2,
# and a constraint applies only if something else pulls it in, so the default
# `uv sync` still installs nothing extra. The bound resolves to 5.9.0, whose
# macOS story is a `py3-none-any` pure-Python fallback wheel -- slower than the
# extension, installable everywhere, and 6.x publishes no such wheel at all.
# 5.7.1 is the floor because it is the newest release that additionally ships a
# real `macosx_10_13_x86_64` wheel, so an Intel or universal2 Python that can
# use one gets one.
#
# Safe for modal 1.5.5: it touches exactly `cbor2.dumps`, `cbor2.loads` and
# `cbor2.CBOREncodeError` (modal/_serialization.py:377-405), all present since
# cbor2 4.x, and imports the module in a try/except so its absence is survivable
# in the first place. Modal's own image builder requirements pin `cbor2==5.7.0`
# (modal/builder/2025.06.txt, modal/builder/PREVIEW.txt), i.e. 5.7.x is the
# version Modal itself runs its client against.
constraint-dependencies = ["cbor2>=5.7.1,<6"]

[tool.uv.workspace]
members = [
    "packages/schema",
    "packages/pychassis",
    "services/sandboxd",
    "services/workers",
]

# Intra-workspace dependencies resolve to the local checkout rather than to
# PyPI, which has no halyard-anything on it. This is the uv equivalent of the
# replace directives every Go module in this repo carries.
[tool.uv.sources]
halyard-schema = { workspace = true }
halyard-chassis = { workspace = true }

[dependency-groups]
# Runtime dependencies (fastapi, modal, asyncpg, google-ads, facebook-business,
# playwright) are added by the task that first needs them, after the relevant
# SPEC §22 fact is verified. Only tooling is pinned here.
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Needed by tests/integration. SPEC 3.2 names asyncpg for the Python
    # services and SPEC 3.3 names Redis, so these are not throwaway: the task
    # that first writes service code against them promotes them to runtime
    # dependencies of that service.
    "asyncpg>=0.30",
    "redis>=5.0",
    "datamodel-code-generator>=0.78.0",
    "jsonschema>=4.26.0",
    # Starlette 1.6's TestClient imports httpx2, not httpx, and raises a
    # RuntimeError telling you to install it if absent. Test-only: the chassis
    # itself makes no outbound HTTP calls yet.
    "httpx2>=0.29",
]

# NOT installed by `uv sync` / `make bootstrap`, and deliberately not folded
# into `dev`: modal pulls grpclib, protobuf, aiohttp and a CLI, which every
# contributor and every CI job would then download to run a benchmark almost
# nobody runs. The tradeoff taken is that `services/sandboxd/src/.../bench`
# imports `modal` lazily and treats its objects as `Any`, so the module
# typechecks and its unit tests pass identically whether or not this group is
# installed -- at the cost of mypy never checking the Modal call signatures.
# That cost is paid back by `docs/verified.md` §22 item 5, which reads those
# signatures out of the wheel, and by task 1.3's integration suite.
#
#   uv sync --group bench
#
# modal is pinned EXACTLY: every release from 1.4.0 to 1.5.5 changed something
# Sandbox-affecting, and 1.5.5's release note promises to remove undocumented
# APIs in 1.6.0. A benchmark whose client floats is not comparable with the
# run before it. SPEC §22 item 5 is verified for exactly this version.
bench = [
    "modal==1.5.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["agent/opencode", "packages/schema/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["agent/opencode", "packages/schema/gen"]

[tool.pytest.ini_options]
testpaths = [
    "packages/pychassis/tests",
    "services/sandboxd/tests",
    "services/workers/tests",
    "tests/contracts",
    "tests/integration",
]
asyncio_mode = "auto"
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
    "integration: needs Postgres and Redis; run with `make test-integration`",
]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "redis.*"]
ignore_missing_imports = true

# modal lives in the optional `bench` group, so on a default `uv sync` it is
# absent and `import modal` has nothing to resolve against. Without this,
# `make typecheck` would pass or fail depending on which groups the developer
# happened to install, which is the kind of environment-dependent check this
# repo has already been bitten by.
[[tool.mypy.overrides]]
module = ["modal.*"]
ignore_missing_imports = true
