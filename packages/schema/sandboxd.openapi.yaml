openapi: 3.1.0

info:
  title: sandboxd
  version: 0.1.0
  description: |
    The internal interface between the Go control plane and the Python sandbox
    orchestrator. SPEC 3.2 requires this file to exist and both the Go client
    and the FastAPI models to be generated from it, because it is the one
    boundary where the two-language split would otherwise drift.

    Not public. Reached over mTLS or a private network with bearer tokens
    (SPEC 3.2). Nothing here is exposed to a sandbox: a sandbox talks to gitd,
    aigw and mcp, never to its own orchestrator.

servers:
  - url: http://sandboxd.internal
    description: Private network. Never routable from a sandbox or the internet.

paths:
  /sessions:
    post:
      operationId: createSession
      summary: Acquire a sandbox for a project branch
      description: |
        SPEC 9 lifecycle. Looks for a warm sandbox matching the template
        image; on a miss creates one from the pre-baked image and restores the
        project's directory snapshot. A per-project Modal Volume is not an
        option here: `volumes=` is create-time only, so Volumes and a warm pool
        are mutually exclusive. Then reconciles the working tree to the branch
        head.

        agentd is the sandbox ENTRYPOINT, not an exec. A ContainerProcess
        handle cannot be reattached from another sandboxd replica (no
        `from_id`, and no RPC enumerates running execs), and only the
        entrypoint's logs are stored by Modal.

        Returns before the sandbox is `live`: time to first preview is an SLO
        (SPEC 17.3, p50 < 10s — provisional until task 1.19 measures Modal's
        snapshot and restore latency, which is unpublished) and the caller
        streams progress rather than blocking on it. Streaming rather than
        blocking is the right shape regardless: a restore has no published
        timing and the SDK's own snapshot timeout defaults to 55s.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "202":
          description: Sandbox is starting. Poll or subscribe for readiness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409":
          description: |
            A session already holds this project. SPEC 19.4: v1 refuses the
            second with a clear message rather than corrupting the tree.
          content:
            application/json:
              schema: { $ref: "./common.schema.json#/components/schemas/ErrorResponse" }
        "429":
          description: Org is at its plan's concurrent-sandbox limit (SPEC 9).
          content:
            application/json:
              schema: { $ref: "./common.schema.json#/components/schemas/ErrorResponse" }

  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { $ref: "./common.schema.json#/components/schemas/Uuid" }
    get:
      operationId: getSession
      summary: Current state of a session
      responses:
        "200":
          description: Session state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404":
          description: Unknown session.
          content:
            application/json:
              schema: { $ref: "./common.schema.json#/components/schemas/ErrorResponse" }
    delete:
      operationId: stopSession
      summary: Snapshot the filesystem and stop the sandbox
      description: |
        SPEC 9 step 7. Snapshot the project directory, THEN terminate — in
        that order, because a snapshot can only be taken from a running
        sandbox. The snapshot image id and its expiry are recorded in Postgres:
        snapshots default to a 30-day TTL and Modal offers no API to list them,
        so a lost row is an unrecoverable, still-billed storage leak.

        The next session for this project restores that image rather than
        reinstalling dependencies. There is no resume: the restored sandbox is
        a new sandbox with a new id and a new tunnel URL.
      responses:
        "204": { description: Stopped. }
        "404":
          description: Unknown session.
          content:
            application/json:
              schema: { $ref: "./common.schema.json#/components/schemas/ErrorResponse" }

  /healthz:
    get:
      operationId: health
      summary: Liveness
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

components:
  schemas:
    CreateSessionRequest:
      type: object
      properties:
        org_id: { $ref: "./common.schema.json#/components/schemas/Uuid" }
        project_id: { $ref: "./common.schema.json#/components/schemas/Uuid" }
        branch: { type: string, minLength: 1 }
        template_image:
          type: string
          minLength: 1
          description: Pre-baked image for the project's template version (SPEC 9 step 2).
        head_sha:
          $ref: "./common.schema.json#/components/schemas/GitSha"
        quotas: { $ref: "#/components/schemas/SessionQuotas" }
      required: [org_id, project_id, branch, template_image]
      additionalProperties: false

    Session:
      type: object
      properties:
        session_id: { $ref: "./common.schema.json#/components/schemas/Uuid" }
        sandbox_id:
          type: string
          description: |
            Modal's identifier for the CURRENT incarnation, and disposable.
            Snapshot-and-recreate yields a new id, so never treat this as
            project identity — key everything on project_id. Worth storing only
            because Sandbox.from_id() reattaches from any sandboxd replica; and
            because V2 sandboxes are not returned by Sandbox.list(), orphan
            reconciliation must use stored ids rather than enumeration.
        state: { $ref: "#/components/schemas/SessionState" }
        tunnel_url:
          type: [string, "null"]
          format: uri
          description: |
            Registered against <branch>.<project>.preview.<domain> in Workers KV
            (SPEC 9 step 5). Null until the dev server is listening.

            NOT STABLE: Modal assigns a random hostname with no way to pin one,
            so this changes on every create and every restore. Re-read it after
            a restore and invalidate the previous KV entry; it is never a
            project-stable address.

            Reachable only from Halyard's proxy via inbound_cidr_allowlist — a
            Modal tunnel is public by default and is a raw TLS stream that does
            no L7 processing, so it adds no X-Forwarded-For. Never handed to a
            browser unsigned: SPEC 14.3 gates preview URLs behind a signed
            cookie, because an unlisted URL is not access control.
        warm:
          type: boolean
          description: Whether this came from the warm pool. The single biggest lever on perceived quality (SPEC 9), so it is measured.
        started_at: { $ref: "./common.schema.json#/components/schemas/Timestamp" }
      required: [session_id, state, warm, started_at]
      additionalProperties: false

    SessionState:
      title: SessionState
      enum: [starting, live, idle, stopped, failed]
      description: Mirrors sessions.state in SPEC 6.

    SessionQuotas:
      type: object
      description: |
        SPEC 9. Hard limits, enforced in agentd and again in aigw — the sandbox
        is untrusted, so a limit checked only inside it is not a limit.
        Omitted fields take the platform default.
      properties:
        wall_clock_seconds_per_turn: { type: integer, minimum: 1, default: 600 }
        tokens_per_turn: { type: integer, minimum: 1, default: 400000 }
        tokens_per_session: { type: integer, minimum: 1, default: 4000000 }
        vcpu:
          type: number
          minimum: 0.1
          default: 2
          description: |
            vCPU, as SPEC 9 states it. Modal's `cpu=` takes PHYSICAL CORES,
            which its pricing page labels "2 vCPU equivalent" — so pass
            `cpu=(vcpu/2, vcpu/2)`. Passing this scalar straight through
            provisions twice the CPU and raises spend ~1.6x, and a bare scalar
            is only a request that permits billed bursting to request + 16
            cores; the tuple is the hard cap this quota claims to be.
        memory_mb: { type: integer, minimum: 256, default: 4096 }
      additionalProperties: false

    Health:
      type: object
      properties:
        status: { title: HealthStatus, enum: [ok, degraded] }
        version: { type: string }
      required: [status]
      additionalProperties: false
